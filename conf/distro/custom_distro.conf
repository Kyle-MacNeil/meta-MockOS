# example distro

include conf/distro/include/Vendor-SoM-base-distro.inc

DISTRO = "custom-distro"


# Mask third-party Astrial SOM image bbappend from meta-hailo-apps
BBMASK += "meta-hailo-apps/recipes-images/images/system-astrial-image.bbappend"

# Rewrite legacy TI cgit URLs to active urls
PREMIRRORS:prepend = "\
    git://git.ti.com/cgit/wilink8-wlan/wl18xx_fw git://git.ti.com/git/wilink8-wlan/wl18xx_fw.git;protocol=https \n \
    git://git.ti.com/cgit/wilink8-wlan/wl18xx_fw git://github.com/varigit/wl18xx_fw.git;protocol=https \n \
    git://git.ti.com/cgit/ti-bt/service-packs git://git.ti.com/git/ti-bt/service-packs.git;protocol=https \n \
    git://git.ti.com/cgit/ti-bt/service-packs git://github.com/varigit/ti-bt-service-packs.git;protocol=https \n \
    git://git.ti.com/cgit/wilink8-wlan/18xx-ti-utils git://git.ti.com/git/wilink8-wlan/18xx-ti-utils.git;protocol=https \n \
"
