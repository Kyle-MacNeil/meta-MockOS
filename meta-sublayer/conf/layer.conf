# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-quectel"
BBFILE_PATTERN_meta-quectel = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-quectel = "6"

LAYERDEPENDS_meta-quectel = "core"
LAYERSERIES_COMPAT_meta-quectel = "kirkstone"
LAYERSERIES_COMPAT_meta-quectel:append = " scarthgap"